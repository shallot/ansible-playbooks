apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-agent-lock-binding
  namespace: gitlab-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-agent-lock-manager
subjects:
  - kind: ServiceAccount
    name: gitlab-agent
    namespace: gitlab-agent
