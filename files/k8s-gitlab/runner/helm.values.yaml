gitlabUrl: "{{ k8s_gitlab_runner_url | default('') }}"
runnerToken: "{{ k8s_gitlab_runner_token | default('') }}"

replicaCount: "{{ k8s_gitlab_runner_replica_count }}"

serviceAccount:
  create: true
  name: "gitlab-runner"

rbac:
  create: true

runners:
{% if k8s_gitlab_runner_token is not defined %}
  configOverride: |
    shutdown_timeout = {{ k8s_gitlab_runner_shutdown_timeout | default('0') }}
    concurrent = {{ k8s_gitlab_runner_concurrent | default('10') }}
    check_interval = {{ k8s_gitlab_runner_check_interval | default('3') }}
    log_level = "{{ k8s_gitlab_runner_log_level | default('info') }}"
{% else %}
  config: |
{% endif %}
    {% for runner in k8s_gitlab_runner_config -%}
    [[runners]]
{% if k8s_gitlab_runner_token is not defined %}
      url = "{{ k8s_gitlab_runner_url | default('') }}"
      executor = "{{ k8s_gitlab_runner_executor | default('kubernetes') }}"
      request_concurrency = {{ k8s_gitlab_runner_request_concurrency | default('3') }}
{% endif %}
      {{ runner.toml | indent(6) }}
    {%- endfor %}
