---

k8s_gitlab_config_data_dir_default:
  "{{ playbook_dir }}/files/k8s-gitlab"

# tasks/helm.yml
gitlab_runner_k8s_helm_releases__to_merge:
  - name: "gitlab-runner"
    order: "{{ k8s_helm_gitlab_runner_order | default(omit) }}"
    repo: "gitlab"
    repo_url: "https://charts.gitlab.io"
    chart: "gitlab-runner"
    namespace: "gitlab-runner"
    create_namespace: true
    values_file: "{{ k8s_gitlab_config_data_dir
                   | default(k8s_gitlab_config_data_dir_default)
                   }}/runner/helm.values.yaml"

gitlab_runner_k8s_custom_packages__to_merge:
  python3-kubernetes: "present"
  python3-yaml: "present"

k8s_gitlab_runner_registry_auth_base64:
  "{{ (k8s_gitlab_runner_registry_username + ':' + k8s_gitlab_runner_registry_password)
    | b64encode }}"

k8s_gitlab_runner_docker_config:
  "{{ lookup('template', k8s_gitlab_config_data_dir
                         | default(k8s_gitlab_config_data_dir_default)
                         + '/k8s-gitlab-registry-credentials.json')
    | string }}"

k8s_gitlab_runner_default_config_toml: |
  environment = ["HOME=/tmp", "GIT_CONFIG_NOSYSTEM=1"]
  [runners.kubernetes]
    namespace = "gitlab-ci-jobs"
    service_account = "default"
    cpu_request = "{{ k8s_gitlab_runner_cpu_request }}"
    cpu_limit = "{{ k8s_gitlab_runner_cpu_limit }}"
    memory_request = "{{ k8s_gitlab_runner_memory_request }}"
    memory_limit = "{{ k8s_gitlab_runner_memory_limit }}"
    privileged = false
    [runners.kubernetes.feature_flags]
      FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY = true
    [runners.kubernetes.pod_security_context]
      seccomp_profile_type = "RuntimeDefault"
    [runners.kubernetes.container_security_context]
      allow_privilege_escalation = false
      capabilities = { drop = ["ALL"], add = ["SETFCAP", "CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"] }
    [[runners.kubernetes.volumes.empty_dir]]
      name = "build-storage"
      mount_path = "/home/build/.local/share/containers"
      medium = "Memory"

gitlab_runner_custom_k8s_definitions__to_merge:
  25_01_jobs_namespace:
    kubeconfig: "{{ k8s_definitions_kubeconfig | default(omit) }}"
    resource_definition: |
      {{ lookup('file', k8s_gitlab_config_data_dir
                        | default(k8s_gitlab_config_data_dir_default)
                        + '/runner/' + '01-jobs-namespace.yaml' )
       | from_yaml }}
  25_02_jobs_role_user:
    kubeconfig: "{{ k8s_definitions_kubeconfig | default(omit) }}"
    resource_definition: |
      {{ lookup('file', k8s_gitlab_config_data_dir
                        | default(k8s_gitlab_config_data_dir_default)
                        + '/runner/' + '02-jobs-role-user.yaml' )
       | from_yaml }}
  25_03_jobs_rolebinding_user:
    kubeconfig: "{{ k8s_definitions_kubeconfig | default(omit) }}"
    resource_definition: |
      {{ lookup('file', k8s_gitlab_config_data_dir
                        | default(k8s_gitlab_config_data_dir_default)
                        + '/runner/' + '03-jobs-rolebinding-user.yaml' )
       | from_yaml }}
  25_04_jobs_role_manager:
    kubeconfig: "{{ k8s_definitions_kubeconfig | default(omit) }}"
    resource_definition: |
      {{ lookup('file', k8s_gitlab_config_data_dir
                        | default(k8s_gitlab_config_data_dir_default)
                        + '/runner/' + '04-jobs-role-manager.yaml' )
       | from_yaml }}
  25_05_jobs_rolebinding_manager:
    kubeconfig: "{{ k8s_definitions_kubeconfig | default(omit) }}"
    resource_definition: |
      {{ lookup('file', k8s_gitlab_config_data_dir
                        | default(k8s_gitlab_config_data_dir_default)
                        + '/runner/' + '05-jobs-rolebinding-manager.yaml' )
       | from_yaml }}
  25_10_secret_registry:
    kubeconfig: "{{ k8s_definitions_kubeconfig | default(omit) }}"
    resource_definition: |
      {{ lookup('template', k8s_gitlab_config_data_dir
                        | default(k8s_gitlab_config_data_dir_default)
                        + '/runner/' + '10-secret-registry.yaml' )
       | from_yaml }}
