---

k8s_traefik_config_data_dir_default:
  "{{ playbook_dir }}/files/k8s-traefik"

traefik_default_additional_args:
  - "--global.checknewversion=false"
  - "--global.sendanonymoususage=false"
  - "--providers.kubernetesgateway.statusaddress.service.name=traefik"

# tasks/helm.yml
traefik_k8s_helm_releases__to_merge:
  - name: "traefik"
    namespace: "traefik"
    create_namespace: true
    repo: "traefik"
    repo_url: "https://traefik.github.io/charts"
    chart: "traefik"
    values_file: "{{ k8s_traefik_config_data_dir
                   | default(k8s_traefik_config_data_dir_default)
                   }}/helm.values.yaml"
