---

- name:
    "provision-k8s-nodes"

  hosts:
    "k8s-nodes"

  pre_tasks:

    # https://docs.ansible.com/ansible/latest/import_tasks_module.html
    - import_tasks:
        "tasks/os/main.yml"

    # https://docs.ansible.com/ansible/latest/import_tasks_module.html
    - import_tasks:
        "tasks/iaas/main.yml"

  tasks:

    # https://docs.ansible.com/ansible/latest/include_tasks_module.html
    - include_tasks:
        "tasks/k8s-nodes-microk8s.yml"
      when: >
        'microk8s-nodes' in group_names

    # https://docs.ansible.com/ansible/latest/include_tasks_module.html
    - include_tasks:
        "tasks/k8s-nodes-kubeadm.yml"
      when: >
        'kubeadm-nodes' in group_names or
        'k8s-cluster-init' in group_names

    # https://docs.ansible.com/ansible/latest/import_tasks_module.html
    - import_tasks:
        "tasks/helm.yml"

    # https://docs.ansible.com/ansible/latest/import_tasks_module.html
    - import_tasks:
        "tasks/k8s.yml"
