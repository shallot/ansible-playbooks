---

# group_vars/k8s-cluster-init.yml
# action_plugins/merge_variable.py
- name:
    "merge_variable : kubeadm_cluster_configuration"
  merge_variable:
    default: {}
    name: "kubeadm_cluster_configuration"
    suffix: "kubeadm_cluster_configuration__to_merge"

# group_vars/k8s-cluster-init.yml
# action_plugins/merge_variable.py
- name:
    "merge_variable : kubelet_configuration"
  merge_variable:
    default: {}
    name: "kubelet_configuration"
    suffix: "kubelet_configuration__to_merge"

# https://docs.ansible.com/ansible/latest/import_tasks_module.html
- import_tasks:
    "tasks/paths.yml"
  vars:
    custom_paths_suffix:
      "k8s_nodes_prerequisite_paths__to_merge"
